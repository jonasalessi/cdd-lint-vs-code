name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CDD_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch the pinned cdd binary
        shell: bash
        run: echo "CDD_BIN=$(node scripts/fetch-cdd.mjs)" >> "$GITHUB_ENV"

      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify

      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: npm run verify

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: npm run verify:windows
